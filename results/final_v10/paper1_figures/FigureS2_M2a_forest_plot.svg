   <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #3d4b5a" transform="translate(10.944 331.726414)">Stratified Cox model M2a (strata: sex x synchronous presentation x M-stage). Hazard ratios are within strata.</text>
   <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #3d4b5a" transform="translate(10.944 338.688)">Dark ink: p &lt; 0.05; grey: p ≥ 0.05. Reference categories: T1–2 (T terms), N0 (N terms); continuous terms per unit; 'unavailable' terms are indicators for missing data.</text>
  </g>
